name: Bug report
description: Report a reproducible application problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use fictional data. Do not include passwords, tokens, .env files, connection strings, or patient information. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which role and screen or API route is affected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps using fictional data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, OS, Node/npm versions, browser, and sanitized errors.
    validations:
      required: true
