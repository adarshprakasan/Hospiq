version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      material-ui:
        patterns: ['@mui/*']
      vite:
        patterns: ['vite', '@vitejs/*']
      eslint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*']
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
